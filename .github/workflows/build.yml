name: Release applications

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            archive_path: "dist/dlii-labeler-linux.tar.gz"
          - platform: macos
            runner: macos-latest
            archive_path: "dist/dlii-labeler-macos.tar.gz"
          - platform: windows
            runner: windows-latest
            archive_path: "dist/dlii-labeler-windows.zip"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Build executable
        run: python scripts/build.py

      - name: Package executable
        if: runner.os == 'Linux'
        run: tar -czf dist/dlii-labeler-linux.tar.gz -C dist dlii_labeler

      - name: Package application bundle
        if: runner.os == 'macOS'
        run: tar -czf dist/dlii-labeler-macos.tar.gz -C dist dlii_labeler.app

      - name: Package executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/dlii_labeler.exe -DestinationPath dist/dlii-labeler-windows.zip

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: dlii-labeler-${{ matrix.platform }}
          path: ${{ matrix.archive_path }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: dlii-labeler-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes
